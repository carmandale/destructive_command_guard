# False positives: non-git safe commands that MUST be allowed
#
# These commands should pass through without blocking.

[[case]]
description = "ls is safe"
command = "ls -la"
expected = "allow"

[[case]]
description = "cat is safe"
command = "cat file.txt"
expected = "allow"

[[case]]
description = "echo is safe"
command = "echo hello"
expected = "allow"

[[case]]
description = "pwd is safe"
command = "pwd"
expected = "allow"

[[case]]
description = "mkdir is safe"
command = "mkdir -p new_dir"
expected = "allow"

[[case]]
description = "cp is safe"
command = "cp file.txt backup.txt"
expected = "allow"

[[case]]
description = "mv is safe"
command = "mv old.txt new.txt"
expected = "allow"

[[case]]
description = "touch is safe"
command = "touch newfile.txt"
expected = "allow"

[[case]]
description = "grep is safe"
command = "grep -r 'pattern' ."
expected = "allow"

[[case]]
description = "find is safe"
command = "find . -name '*.rs'"
expected = "allow"

[[case]]
description = "cargo build is safe"
command = "cargo build --release"
expected = "allow"

[[case]]
description = "cargo test is safe"
command = "cargo test"
expected = "allow"

[[case]]
description = "cargo run is safe"
command = "cargo run"
expected = "allow"

[[case]]
description = "npm install is safe"
command = "npm install"
expected = "allow"

[[case]]
description = "python script is safe"
command = "python script.py"
expected = "allow"

[[case]]
description = "make is safe"
command = "make all"
expected = "allow"

# ============================================================================
# Redirections that are ordinary, wherever they sit
# ============================================================================
#
# The .agent-config-y1h6c fix moves a redirection to the end of its simple
# command before the patterns run. Moving text is a rewrite, so these rows pin
# the two ways it could over-block: a benign command whose redirection is
# interposed must stay allowed, and a redirection already at the end must be
# left exactly where its own patterns expect to find it.

[[case]]
description = "trailing redirection on a safe command"
command = "ls -la > out.txt"
expected = "allow"

[[case]]
description = "interposed redirection on a safe git subcommand"
command = "git >/dev/null status"
expected = "allow"

[[case]]
description = "trailing redirection plus fd duplication"
command = "git status >/dev/null 2>&1"
expected = "allow"

[[case]]
description = "interposed redirection on a non-destructive rm"
command = "rm >/dev/null -f ./build/artifact.o"
expected = "allow"

[[case]]
description = "a destructive-looking string inside quoted data stays data"
command = 'echo "rm >/dev/null -rf /" > note.txt'
expected = "allow"
