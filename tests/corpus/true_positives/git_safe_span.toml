# True positives: a safe git command after a separator must not exempt the
# destructive git command in front of it (.agent-config-t17jx).
#
# The core.git safe patterns opened with `git\s+(?:\S+\s+)*`, whose leftmost
# match started at the first `git` on the line and ran through the separator to
# the safe subcommand. The span covered the destructive command, and the
# start-inside-span rule (.agent-config-it2wk) exempted it.

[[case]]
description = "force push is not exempted by a later checkout -b"
command = "git push --force origin main && git checkout -b feat"
expected = "deny"
rule_id = "core.git:push-force-long"

[[case]]
description = "force push is not exempted by a later checkout -b after a semicolon"
command = "git push --force origin main ; git checkout -b feat"
expected = "deny"
rule_id = "core.git:push-force-long"

[[case]]
description = "force push is not exempted by a later checkout --orphan"
command = "git push --force origin main || git checkout --orphan gh-pages"
expected = "deny"
rule_id = "core.git:push-force-long"

[[case]]
description = "force push is not exempted by a checkout -b on the next line"
command = "git push --force origin main\ngit checkout -b feat"
expected = "deny"
rule_id = "core.git:push-force-long"

[[case]]
description = "reset --hard is not exempted by a later clean -n"
command = "git reset --hard && git clean -n"
expected = "deny"
rule_id = "core.git:reset-hard"

# The reverse order: a safe git command FIRST must not exempt a destructive git
# command after it (.agent-config-uyc9l). The destructive patterns keep the
# separator-crossing skipper, so their leftmost match started at the first `git`,
# inside the safe command's span.

[[case]]
description = "force push is not exempted by an earlier checkout -b"
command = "git checkout -b feat && git push --force origin main"
expected = "deny"
rule_id = "core.git:push-force-long"

[[case]]
description = "reset --hard is not exempted by an earlier checkout -b after a semicolon"
command = "git checkout -b feat ; git reset --hard"
expected = "deny"
rule_id = "core.git:reset-hard"

[[case]]
description = "force push is not exempted by a checkout -b on the line before it"
command = "git checkout -b feat\ngit push --force origin main"
expected = "deny"
rule_id = "core.git:push-force-long"

[[case]]
description = "clean -fd is not exempted by an earlier clean -n"
command = "git clean -n && git clean -fd"
expected = "deny"
rule_id = "core.git:clean-force"

[[case]]
description = "restore of the worktree is not exempted by an earlier restore --staged"
command = "git restore --staged a.txt && git restore b.txt"
expected = "deny"
rule_id = "core.git:restore-worktree"
