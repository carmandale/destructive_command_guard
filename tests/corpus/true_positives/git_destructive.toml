# True positives: git commands that MUST be blocked
#
# These commands are genuinely destructive and dcg should deny them.

[[case]]
description = "git reset --hard discards uncommitted changes"
command = "git reset --hard"
expected = "deny"
rule_id = "core.git:reset-hard"
[case.log]
decision = "deny"
mode = "deny"
pack_id = "core.git"
pattern_name = "reset-hard"
rule_id = "core.git:reset-hard"
reason_contains = "destroys uncommitted changes"

[[case]]
description = "git reset --hard with ref"
command = "git reset --hard HEAD~5"
expected = "deny"
rule_id = "core.git:reset-hard"

[[case]]
description = "git clean with force"
command = "git clean -fd"
expected = "deny"
rule_id = "core.git:clean-force"

[[case]]
description = "git clean -fdx removes ignored files"
command = "git clean -fdx"
expected = "deny"
rule_id = "core.git:clean-force"

# NOTE: git checkout -f is not currently blocked.
# Tracked in: tests/corpus/README.md (future enhancement)
# [[case]]
# description = "git checkout with force overwrites"
# command = "git checkout -f main"
# expected = "deny"
# rule_id = "core.git:checkout-force"

[[case]]
description = "git stash drop discards stash"
command = "git stash drop"
expected = "deny"
rule_id = "core.git:stash-drop"

[[case]]
description = "git stash clear drops all stashes"
command = "git stash clear"
expected = "deny"
rule_id = "core.git:stash-clear"

[[case]]
description = "git branch -D force deletes"
command = "git branch -D feature-branch"
expected = "deny"
rule_id = "core.git:branch-force-delete"

[[case]]
description = "git push --force"
command = "git push --force origin main"
expected = "deny"
rule_id = "core.git:push-force-long"

[[case]]
description = "git push -f (short form)"
command = "git push -f origin main"
expected = "deny"
rule_id = "core.git:push-force-short"

# Narrowing push-force to the push's own arguments (.agent-config-hmv9n) must not
# lose a real force push that follows a separator or trails its positional args.

[[case]]
description = "git push -f after a && separator still blocks"
command = "cd /repo && git push -f origin main"
expected = "deny"
rule_id = "core.git:push-force-short"

[[case]]
description = "git push with -f trailing the positional args still blocks"
command = "git push origin main -f"
expected = "deny"
rule_id = "core.git:push-force-short"

[[case]]
description = "git push with --force trailing the positional args still blocks"
command = "git push origin main --force"
expected = "deny"
rule_id = "core.git:push-force-long"

[[case]]
description = "git push --force after a ; separator still blocks"
command = "git fetch; git push --force origin main"
expected = "deny"
rule_id = "core.git:push-force-long"

# git global options can hold ; & | inside $(...), quotes or escapes. A candidate
# fix for .agent-config-qv9dy that stopped the option skipper at those characters
# was measured letting every command below through; they pin the skipper's reach.

[[case]]
description = "git -C $(cd \"$(dirname ...)\" && pwd) still blocks push --force"
command = 'git -C "$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)" push --force origin main'
expected = "deny"
rule_id = "core.git:push-force-long"

[[case]]
description = "git -C $(cd a && pwd) still blocks restore"
command = 'git -C $(cd a && pwd) restore f.txt'
expected = "deny"
rule_id = "core.git:restore-worktree"

[[case]]
description = "git -c with an escaped ; still blocks checkout <ref> --"
command = 'git -c a.b=x\;y checkout HEAD -- f.txt'
expected = "deny"
rule_id = "core.git:checkout-ref-discard"

[[case]]
description = "git -c with a quoted value holding ; still blocks checkout <ref> --"
command = "git -c alias.x='a;b' checkout HEAD -- f.txt"
expected = "deny"
rule_id = "core.git:checkout-ref-discard"

[[case]]
description = "git -c with a quoted value holding | still blocks push --force"
command = "git -c user.name=\"a|b\" push origin main --force"
expected = "deny"
rule_id = "core.git:push-force-long"
