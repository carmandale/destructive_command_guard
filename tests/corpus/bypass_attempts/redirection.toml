# Bypass attempts: a redirection glued to the command word
#
# `>` and `<` are shell metacharacters. They end the current word wherever they
# appear, so `git>/dev/null reset --hard` runs exactly what
# `git >/dev/null reset --hard` runs -- but pack patterns anchor the command
# word with `git\s+`, and the glued spelling never reached them. Every row here
# was ALLOWED before .agent-config-6yt2i.
#
# NOTE: This file contains ONLY commands expected to be DENIED.
# The matching false-positive rows -- hyphenated program names that merely end
# in a keyword -- live in ../false_positives/hyphenated_commands.toml. The two
# sets are one question (where does a command word begin and end?) asked from
# opposite sides, so a change that fixes one must be run against both.

# ============================================================================
# Quoted command word plus glued redirection -- the reported spelling
# ============================================================================

[[case]]
description = "quoted command word with glued redirection"
command = '"git">/dev/null reset --hard'
expected = "deny"
rule_id = "core.git:reset-hard"

# ============================================================================
# Unquoted glued redirections
# ============================================================================

[[case]]
description = "glued stdout redirection to /dev/null"
command = "git>/dev/null reset --hard"
expected = "deny"
rule_id = "core.git:reset-hard"

[[case]]
description = "glued append redirection"
command = "git>>build.log reset --hard"
expected = "deny"
rule_id = "core.git:reset-hard"

[[case]]
description = "glued both-streams redirection"
command = "git&>/dev/null reset --hard"
expected = "deny"
rule_id = "core.git:reset-hard"

[[case]]
description = "glued stdin redirection"
command = "git</dev/null reset --hard"
expected = "deny"
rule_id = "core.git:reset-hard"

# ============================================================================
# A hyphenated lookalike in front of the real command
# ============================================================================
#
# The git pattern's `(?:\S+\s+)*` makes its leftmost match swallow the whole
# line starting inside `my-git`. Rejecting that start must not retire the
# pattern for the rest of the command, or hiding behind a lookalike becomes the
# next bypass.

[[case]]
description = "hyphenated lookalike ahead of a real destructive command"
command = "my-git status && git reset --hard"
expected = "deny"
rule_id = "core.git:reset-hard"

# ============================================================================
# A redirection parked BETWEEN the command word and its arguments
# ============================================================================
#
# The rows above are about tokenization: the glued spelling never reached the
# matcher. These rows fail in the SPACED spelling too, so they are about the
# patterns themselves (.agent-config-y1h6c). A pack pattern spells a command
# and its arguments as one run of tokens -- `rm\s+...-rf`, `reset\s+--hard` --
# and a redirection is legal anywhere in a simple command, so one parked
# between those tokens split them apart and walked through. The shell strips
# the operator and its target out of the argument list before the program is
# executed, so every row here ran the destructive command for real.
#
# `git >/dev/null reset --hard` denied even before the fix, because the git
# pattern's `(?:\S+\s+)*` happens to absorb one word there. There is no such
# absorber between `reset` and `--hard`, and none at all after `rm`.

[[case]]
description = "redirection between rm and its flags"
command = "rm >/dev/null -rf /"
expected = "deny"
rule_id = "core.filesystem:rm-rf-root-home"

[[case]]
description = "redirection with a spaced target between rm and its flags"
command = "rm > /dev/null -rf /"
expected = "deny"
rule_id = "core.filesystem:rm-rf-root-home"

[[case]]
description = "append redirection between rm and its flags"
command = "rm >>build.log -rf /"
expected = "deny"
rule_id = "core.filesystem:rm-rf-root-home"

[[case]]
description = "stdin redirection between rm and its flags"
command = "rm </dev/null -rf /"
expected = "deny"
rule_id = "core.filesystem:rm-rf-root-home"

[[case]]
description = "fd-duplicating redirection between rm and its flags"
command = "rm 2>&1 -rf /"
expected = "deny"
rule_id = "core.filesystem:rm-rf-root-home"

[[case]]
description = "both-streams redirection between rm and its flags"
command = "rm &>/dev/null -rf /"
expected = "deny"
rule_id = "core.filesystem:rm-rf-root-home"

[[case]]
description = "redirection ahead of the command word"
command = ">/dev/null rm -rf /"
expected = "deny"
rule_id = "core.filesystem:rm-rf-root-home"

[[case]]
description = "redirection between a git subcommand and its flag"
command = "git reset >/dev/null --hard"
expected = "deny"
rule_id = "core.git:reset-hard"

[[case]]
description = "fd-prefixed redirection between a git subcommand and its flag"
command = "git reset 2>/dev/null --hard"
expected = "deny"
rule_id = "core.git:reset-hard"

[[case]]
description = "interposed redirection in the second command of a list"
command = "ls -la; rm >/dev/null -rf /"
expected = "deny"
rule_id = "core.filesystem:rm-rf-root-home"

[[case]]
description = "interposed redirection on the far side of a pipe"
command = "echo hi | xargs rm >/dev/null -rf /"
expected = "deny"
rule_id = "core.filesystem:rm-rf-root-home"
