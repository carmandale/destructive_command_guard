name: bench

# Benchmark enforcement for performance regressions
#
# This workflow:
# 1. Runs criterion benchmarks on PRs and pushes to main
# 2. Benches the base commit first, on the same runner, and compares this
#    commit against it
# 3. Fails on significant regressions
# 4. Uploads benchmark results as artifacts
#
# Performance budgets are defined in src/perf.rs

on:
  pull_request:
    paths:
      - 'src/**'
      - 'benches/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/bench.yml'
  # `master` is deliberately absent. It is a stale duplicate ref (it sat at
  # f170d642 while main moved on) and listing it fired a second full cold
  # build for every commit -- 03:42:53 on main and 03:42:54 on master were the
  # same SHA. See .agent-config-h4qaa.
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'benches/**'
      - 'Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/bench.yml'
  # Allow manual trigger
  workflow_dispatch:
  # No weekly schedule. It ran "for baseline tracking", and the baseline is now
  # made per run from the base commit (below), so a scheduled run would only
  # re-measure the tip against its parent -- which that commit's own push run
  # already did.

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  benchmark:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The base commit is benched too, so it has to be here.
          fetch-depth: 0

      - uses: dtolnay/rust-toolchain@nightly

      # `target` is deliberately not cached here, for the reason
      # .agent-config-wrlqe recorded on the check job: cargo never GCs a target
      # dir, so a cached one carries every previous generation's artifacts. The
      # key carries `-registry-` because a restore replays the archive as it was
      # saved -- leaving the old `-cargo-bench-` key would restore a `target`
      # no matter what `path` says here.
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-bench-registry-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-bench-registry-

      # There is no separate build step. `cargo build --release --benches` used
      # to stand here and it is what died at exit 143 ten runs running. It built
      # both bench targets under the `release` profile while the step below runs
      # one of them under `bench`, so it was a second compile of the whole graph
      # that warmed nothing. `cargo bench` builds what it needs.
      - name: Report runner headroom
        run: |
          # The job log recorded only that the runner was told to stop. Print
          # what it had, so the next death names its own cause.
          nproc && free -m && df -h /

      # The baseline is made on THIS runner, from the base commit, so the
      # comparison below measures the commit and not the machine. It used to be
      # a cached `target/criterion` under the fixed key
      # `criterion-baseline-main`. An exact-key hit is never re-saved, so that
      # cache held the one run that created it, and every later run, on
      # whatever runner it got, was compared with it. Against that one baseline
      # pack_aware_quick_reject/worst_case/no_match -- code no commit in
      # 8df226c4..56f22bc2 changed -- read -62%, -18%, +69% and +117% on four
      # runs, and the last two failed the gate; the +117% failed fe91868e, a
      # behaviour-preserving refactor (.agent-config-qjafi).
      - name: Benchmark the base commit on this runner
        env:
          # Push only: a pull_request `synchronize` also carries `before` (the
          # previous PR head), which is not what a PR is measured against.
          PUSH_BEFORE: ${{ github.event_name == 'push' && github.event.before || '' }}
        run: |
          HEAD_SHA=$(git rev-parse HEAD)
          # A push is compared with the tip it replaced, so a push of several
          # commits is measured whole. Everything else uses HEAD~1: for a pull
          # request HEAD is the merge commit, whose first parent is the base it
          # was built on. A push that creates a ref carries 0000000.
          BASE="$PUSH_BEFORE"
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            BASE=$(git rev-parse HEAD~1)
          fi
          echo "Base commit: \`$BASE\`" >> "$GITHUB_STEP_SUMMARY"
          git checkout --quiet "$BASE"
          if ! cargo bench --bench heredoc_perf -- --noplot --save-baseline base > base-output.txt 2>&1; then
            echo "::warning::base commit $BASE did not bench, so nothing below is compared"
            tail -20 base-output.txt
          fi
          # --force: without --locked, cargo may have rewritten a stale
          # Cargo.lock at the base, and a plain checkout refuses to overwrite
          # it -- a red run with nothing measured.
          git checkout --quiet --force "$HEAD_SHA"

      - name: Run benchmarks
        run: |
          # Compare with the base commit's run above. Lenient: a benchmark the
          # base does not have is reported without a comparison, not an error.
          cargo bench --bench heredoc_perf -- --noplot --baseline-lenient base 2>&1 | tee bench-output.txt

          # Extract timing summary for CI
          echo "## Benchmark Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Performance budgets are defined in \`src/perf.rs\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          grep -E '(time:|change:|Performance)' bench-output.txt | head -50 >> $GITHUB_STEP_SUMMARY || true
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Check for regressions
        run: |
          # Check for significant regressions (>20% slower)
          if grep -q "Performance has regressed" bench-output.txt; then
            echo "::warning::Performance regression detected"
            # Extract regression details
            grep -A5 "Performance has regressed" bench-output.txt || true
          fi

          # Check for large regressions that should fail CI (>50% slower)
          if grep -E "change:.*\+[5-9][0-9]\." bench-output.txt; then
            echo "::error::Significant performance regression (>50%) detected"
            echo "See benchmark output for details"
            exit 1
          fi

          # Also fail if any benchmark shows >100% regression
          if grep -E "change:.*\+[0-9]{3,}\." bench-output.txt; then
            echo "::error::Critical performance regression (>100%) detected"
            exit 1
          fi

      # always(): a red run is the one whose numbers someone needs, and it
      # used to upload nothing (the step was skipped on fe91868e's red).
      - name: Upload benchmark results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results
          path: |
            base-output.txt
            bench-output.txt
            target/criterion
          retention-days: 30

  # This job is pull-request only, so a push to main never reaches it -- that
  # skip is the `if` below, not a failure. It also does not compare anything:
  # it downloads the artifact and echoes fixed text. The regression gate that
  # actually reads the numbers is "Check for regressions" in `benchmark` above.
  # Recorded under .agent-config-h4qaa so nobody reads this skip as a signal.
  compare:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    needs: benchmark
    steps:
      - uses: actions/checkout@v4

      - name: Download PR benchmark results
        uses: actions/download-artifact@v4
        with:
          name: benchmark-results
          path: pr-results

      - name: Generate comparison summary
        run: |
          echo "## PR Benchmark Comparison" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Benchmarks ran successfully. Check the benchmark job for detailed results." >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Key performance budgets:" >> $GITHUB_STEP_SUMMARY
          echo "- Quick reject: < 50μs (panic threshold)" >> $GITHUB_STEP_SUMMARY
          echo "- Fast path: < 500μs (panic threshold)" >> $GITHUB_STEP_SUMMARY
          echo "- Full pipeline: < 50ms (panic threshold)" >> $GITHUB_STEP_SUMMARY
