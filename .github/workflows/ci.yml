name: ci

# TOOLCHAIN: this repository is pinned, and rust-toolchain.toml is where the pin
# lives. Read that file for the incident and the reasoning; this note is only
# about how the pin survives contact with the steps below.
#
# The `dtolnay/rust-toolchain@nightly` steps in this workflow install rustup's
# floating nightly and `rustup default` it. They do NOT decide what builds this
# code. rust-toolchain.toml sits at the checkout root and overrides the runner
# default for every cargo/rustc run in the job, so the pin holds even though the
# refs below still say `@nightly`. The action stays because it also bootstraps
# rustup where it is missing, and the now-redundant install is cheap: measured
# at `--profile minimal`, 8.2s, in run 35062485196.
#
# The floating nightly still gets read -- in `toolchain-float`, at the bottom of
# this file. Before 2026-09-16 that news arrived as a red `check` on an innocent
# commit, which skipped every other job and darkened the pipeline for everyone
# (.agent-config-nicdp).

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    # Run deep suite daily at 3am UTC
    - cron: '0 3 * * *'
  workflow_dispatch:
    # Allow manual triggering for deep suite

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # Formatting is its own job, and nothing `needs:` it; see .agent-config-j1qwb.
  #
  # It used to be the first step of `check`, so one unformatted line stopped
  # clippy and the whole test step, and every job below that `needs: check`
  # went with them. The run showed one red gate while the rest never ran. That
  # happened four times (.agent-config-pcqod, .agent-config-moubj,
  # .agent-config-w2stx, .agent-config-j1qwb); the last one, a single line in
  # tests/repro_herestring_language_from_receiver.rs, kept the suite dark from
  # run 35416986220 on 2026-09-19 to run 37176865382 on 2026-10-04.
  #
  # A format diff still turns the run red. It just no longer hides the answers
  # to every other question.
  fmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt -- --check

  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate Dependabot config
        run: |
          ruby -e 'require "yaml"; config = YAML.load_file(".github/dependabot.yml"); puts "Dependabot config:"; puts config.inspect'

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      # `target` is deliberately not cached here; see .agent-config-wrlqe.
      #
      # cargo never GCs a target dir, so a cached one carries every previous
      # generation's artifacts plus whatever the run adds. Measured on run
      # 35049780561, which started from an empty cache: `target` went 1.2G ->
      # 60G across the test step, free space on the runner went 84G -> 25G,
      # and Post job then saved a 10.74G entry for the next run to restore.
      # Two more generations of that and the job is back where
      # .agent-config-dcg-ci-runner-out-of-disk-3in9f found it.
      #
      # It was not buying speed either. That cold run did the whole job in
      # 21m39s and then spent 3m27s saving the entry, while the previous
      # warm-cache run took 28m33s and died. What is worth caching is the
      # registry: crate sources are bounded and re-downloading them is pure
      # loss. Compilation is not cached, so every run rebuilds from the same
      # baseline and headroom stays flat by construction rather than by
      # anyone remembering to prune.
      #
      # The key carries `-registry-` because a restore replays the archive as
      # it was saved: leaving the old key would have restored the 60G
      # `target` no matter what `path` says here.

      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-check-registry-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-check-registry-

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

      # Bounded and non-fatal on purpose; see .agent-config-ibvzi.
      #
      # This fetches a third-party installer from a moving `main` and pipes it
      # to bash, so the script itself is stdin and an interactive read inside
      # it has nowhere to read from. It self-updates on the way through
      # ("New version available: 5.4.4 (you have 5.4.2) ... Re-running
      # installer with latest version"), so the bytes that run are not the
      # bytes that were fetched. On run 35051658039 it wedged for over an
      # hour against 6m25s on the run before it.
      #
      # AGENTS.md calls UBS warning-only and the next step is written to
      # match -- it wraps `ubs` in an if/else and degrades to a warning when
      # the binary is absent. Without `continue-on-error` here, though, a
      # failed install still failed the whole blocking job: the non-blocking
      # tool's installer was blocking.

      - name: Install UBS
        timeout-minutes: 10
        continue-on-error: true
        run: |
          curl -fsSL "https://raw.githubusercontent.com/Dicklesworthstone/ultimate_bug_scanner/main/install.sh" \
            | bash -s -- --easy-mode
          # Add UBS to PATH for this job
          echo "$HOME/.ubs" >> $GITHUB_PATH

      - name: Run UBS on changed files
        if: always()
        run: |
          echo "=== UBS Static Analysis ===" | tee -a ubs-output.log
          echo "Timestamp: $(date -Iseconds)" | tee -a ubs-output.log
          echo "" | tee -a ubs-output.log

          echo "=== UBS Smoke Test ===" | tee -a ubs-output.log
          cat > /tmp/ubs_smoke.rs <<'EOF'
          fn main() {
              println!("ubs smoke test");
          }
          EOF
          if ubs --verbose /tmp/ubs_smoke.rs 2>&1 | tee -a ubs-output.log; then
            echo "UBS Smoke Test: PASSED" | tee -a ubs-output.log
          else
            echo "UBS Smoke Test: WARNINGS (non-blocking)" | tee -a ubs-output.log
            echo "::warning::UBS smoke test reported issues"
          fi
          echo "" | tee -a ubs-output.log

          # Get changed Rust files
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            CHANGED=$(git diff --name-only origin/${{ github.base_ref }}...HEAD -- "*.rs" | tr "\n" " ")
            echo "Mode: Pull Request (base: ${{ github.base_ref }})" | tee -a ubs-output.log
          else
            CHANGED=$(git diff --name-only HEAD~1 -- "*.rs" | tr "\n" " ")
            echo "Mode: Push (comparing to HEAD~1)" | tee -a ubs-output.log
          fi

          echo "Changed files: ${CHANGED:-none}" | tee -a ubs-output.log
          echo "" | tee -a ubs-output.log

          if [ -n "$CHANGED" ]; then
            echo "Running UBS analysis..." | tee -a ubs-output.log
            if ubs --verbose $CHANGED 2>&1 | tee -a ubs-output.log; then
              echo "" | tee -a ubs-output.log
              echo "UBS Result: PASSED (no issues found)" | tee -a ubs-output.log
            else
              echo "" | tee -a ubs-output.log
              echo "UBS Result: WARNINGS (issues found - non-blocking)" | tee -a ubs-output.log
              echo "::warning::UBS found potential issues in changed files"
            fi
          else
            echo "UBS Result: SKIPPED (no Rust files changed)" | tee -a ubs-output.log
          fi

          echo "" | tee -a ubs-output.log
          echo "=== End UBS Analysis ===" | tee -a ubs-output.log

      - name: UBS summary
        if: always()
        run: |
          echo "## UBS Static Analysis" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY
          cat ubs-output.log >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo "No UBS output" >> $GITHUB_STEP_SUMMARY
          echo "\`\`\`" >> $GITHUB_STEP_SUMMARY

      - name: Upload UBS output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: ubs-output
          path: ubs-output.log
          retention-days: 7

      # Two steps used to sit here and both are gone on purpose; see
      # .agent-config-dcg-ci-runner-out-of-disk-3in9f.
      #
      # `cargo check --all-targets` ran after `cargo clippy --all-targets`
      # above. Clippy already runs that check pass, and clippy-driver
      # fingerprints differently, so the second pass rebuilt the whole
      # metadata tree for no coverage this job did not already have.
      #
      # `cargo build --release` built a binary nothing in this job reads.
      # Every Rust test spawns through `tests/common/spawn.rs`, which
      # resolves `CARGO_BIN_EXE_dcg` -- the debug binary nextest builds --
      # and `tests/spawn_isolation.rs` enforces that no other spelling
      # exists. The `target/release/dcg` consumers are the shell scripts
      # under `tests/e2e/` and `tests/scripts/`, which run in the `e2e`
      # job, and that job builds its own release binary.
      #
      # Carrying a debug tree and a release tree in one job is what ran the
      # hosted runner out of disk: runs 35044298390 and 35047392666 both
      # ended in `No space left on device` during `Run tests`, so the test
      # signal never completed. This job also shared the bare
      # `Linux-cargo-` cache key with `e2e`, so it restored e2e's release
      # tree even when it built none; the key above now follows the
      # per-job convention every other job in this file already uses.

      - name: Disk before tests
        run: |
          df -h /
          du -sh target || true

      - name: Run tests (with JUnit XML report)
        run: |
          cargo nextest run --profile ci --no-fail-fast

      - name: Disk after tests
        if: always()
        run: |
          df -h /
          du -sh target || true

      # A "Generate test summary" step sat here and is gone on purpose; see
      # .agent-config-j1qwb. It ran `cargo test -- --list` twice under
      # `if: always()` to print a test count. When an earlier step had failed,
      # nothing was built yet, so it compiled the whole test graph to count it:
      # 12m46s of run 37176865382's 13m `check`, after formatting had already
      # failed at 28s. nextest prints the count itself, and the JUnit report
      # below carries every case.

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-check
          path: target/nextest/ci/junit.xml
          retention-days: 14
          if-no-files-found: ignore

  coverage:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-cov-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-cov-

      # `--all-features` is deliberately absent here; see .agent-config-u8eec.
      #
      # It was the only `--all-features` in the repository, and the only thing
      # that turned on `rich-output`, which swaps the whole CLI renderer for
      # rich_rust. Nothing ships that: `dist.yml` builds `cargo build
      # --release` with default features. So this job was measuring coverage
      # of a binary no user gets, and failing on the difference -- 24 cli_e2e
      # tests pin the default renderer's text and nothing pins the rich one.
      # `doctor_pretty_output_basics` wants "Checking configuration... USING
      # DEFAULTS"; the rich path prints "Configuration: No config file found;
      # using defaults". Two UIs, one contract.
      #
      # The instrumentation was never the cause, which is worth writing down
      # because the job's name makes llvm-cov the obvious suspect. Measured
      # 2026-09-16 on macOS with no coverage tooling in the loop:
      #
      #   cargo test --test cli_e2e                  -> 127 passed, 0 failed
      #   cargo test --test cli_e2e --all-features   -> 103 passed, 24 failed
      #
      # and those 24 are the same 24 names, exactly, that the coverage job
      # reports on ubuntu (run 35052834031, job 104661764384).
      #
      # Consequence, tracked by .agent-config-swwbz: with this flag gone,
      # nothing in CI compiles `rich-output` at all. That feature is
      # mid-migration and already broken -- it emits literal `[bold green]`
      # and `[/]` markup to the terminal -- so that bead owns both the defect
      # and the question of where it should be built.
      - name: Run tests with coverage
        run: |
          cargo llvm-cov --workspace \
            --ignore-filename-regex='(tests/|benches/|\.cargo/)' \
            --no-report

      - name: Generate coverage reports
        run: |
          # Generate LCOV from collected data (no re-running tests)
          # Note: report subcommand doesn't accept --all-features/--workspace
          cargo llvm-cov report \
            --ignore-filename-regex='(tests/|benches/|\.cargo/)' \
            --lcov --output-path lcov.info
          # Generate JSON for programmatic threshold checking
          cargo llvm-cov report \
            --ignore-filename-regex='(tests/|benches/|\.cargo/)' \
            --json --output-path coverage.json
          # Create human-readable summary from JSON
          jq -r '
            "Coverage Summary:",
            "  Overall: \(.data[0].totals.lines.percent | . * 100 | round / 100)% lines covered",
            "  Functions: \(.data[0].totals.functions.percent | . * 100 | round / 100)% covered",
            "",
            "File coverage (lines):",
            (.data[0].files | sort_by(-.summary.lines.percent) | .[:10][] |
              "  \(.filename | split("/") | .[-1]): \(.summary.lines.percent | . * 100 | round / 100)%")
          ' coverage.json > coverage-summary.txt
          echo "## Coverage Summary" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          cat coverage-summary.txt >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          fail_ci_if_error: false
          verbose: true
          name: dcg-coverage
          flags: unittests
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

      - name: Codecov upload status
        if: always()
        run: |
          echo "## Codecov Upload" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f lcov.info ]; then
            lines=$(wc -l < lcov.info)
            echo "- Coverage file: lcov.info ($lines lines)" >> $GITHUB_STEP_SUMMARY
          else
            echo "- Warning: Coverage file not found" >> $GITHUB_STEP_SUMMARY
          fi
          echo "- Upload: Attempted (check Codecov dashboard for status)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "Dashboard: https://codecov.io/gh/Dicklesworthstone/destructive_command_guard" >> $GITHUB_STEP_SUMMARY

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: |
            lcov.info
            coverage.json
            coverage-summary.txt
          retention-days: 30

      - name: Check coverage thresholds (enforced)
        run: |
          set -euo pipefail

          OVERALL_MIN="70.0"
          EVALUATOR_MIN="65.0"
          HOOK_MIN="70.0"

          # Parse coverage from JSON using jq (more reliable than text parsing)
          overall=$(jq -r '.data[0].totals.lines.percent' coverage.json)
          evaluator=$(jq -r '.data[0].files[] | select(.filename | endswith("evaluator.rs")) | .summary.lines.percent' coverage.json)
          hook=$(jq -r '.data[0].files[] | select(.filename | endswith("hook.rs")) | .summary.lines.percent' coverage.json)

          echo "Coverage thresholds:"
          echo "  overall >= ${OVERALL_MIN}%"
          echo "  src/evaluator.rs >= ${EVALUATOR_MIN}%"
          echo "  src/hook.rs >= ${HOOK_MIN}%"
          echo ""
          echo "Observed coverage:"
          printf "  overall=%.2f%%\n" "$overall"
          printf "  src/evaluator.rs=%.2f%%\n" "$evaluator"
          printf "  src/hook.rs=%.2f%%\n" "$hook"

          echo "coverage_overall=${overall}" >> "$GITHUB_OUTPUT"
          echo "coverage_evaluator=${evaluator}" >> "$GITHUB_OUTPUT"
          echo "coverage_hook=${hook}" >> "$GITHUB_OUTPUT"

          failures=0
          if [ -z "$overall" ] || [ "$overall" = "null" ]; then
            echo "::error::Failed to parse overall coverage from coverage.json"
            failures=$((failures + 1))
          elif awk -v v="$overall" -v min="$OVERALL_MIN" 'BEGIN{exit !(v+0 < min+0)}'; then
            printf "::error::Overall coverage %.2f%% is below ${OVERALL_MIN}%%\n" "$overall"
            failures=$((failures + 1))
          fi

          if [ -z "$evaluator" ] || [ "$evaluator" = "null" ]; then
            echo "::error::Failed to parse src/evaluator.rs coverage from coverage.json"
            failures=$((failures + 1))
          elif awk -v v="$evaluator" -v min="$EVALUATOR_MIN" 'BEGIN{exit !(v+0 < min+0)}'; then
            printf "::error::src/evaluator.rs coverage %.2f%% is below ${EVALUATOR_MIN}%%\n" "$evaluator"
            failures=$((failures + 1))
          fi

          if [ -z "$hook" ] || [ "$hook" = "null" ]; then
            echo "::error::Failed to parse src/hook.rs coverage from coverage.json"
            failures=$((failures + 1))
          elif awk -v v="$hook" -v min="$HOOK_MIN" 'BEGIN{exit !(v+0 < min+0)}'; then
            printf "::error::src/hook.rs coverage %.2f%% is below ${HOOK_MIN}%%\n" "$hook"
            failures=$((failures + 1))
          fi

          if [ "$failures" -gt 0 ]; then
            echo "::error::Coverage thresholds not met (${failures} failure(s))"
            exit 1
          fi

          echo "Coverage thresholds satisfied."

  # Memory leak detection tests
  memory-tests:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly

      # `target` is deliberately NOT cached. cargo never GCs it, so each cache
      # generation restores the previous tree plus whatever this run added, and
      # headroom shrinks monotonically -- see .agent-config-wrlqe. The key
      # carries `-registry-` so actions/cache cannot replay an older archive
      # that still holds a target tree, no matter what `path` says here.
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ runner.os }}-cargo-memory-registry-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-memory-registry-

      - name: Report runner headroom
        run: |
          # The job log recorded only that the runner was told to stop. Print
          # what it had, so the next death names its own cause.
          nproc && free -m && df -h /

      - name: Run memory tests
        id: memory_tests
        run: |
          # `if cargo test ... | tee ...` tests TEE's status, not cargo's, and
          # tee always succeeds. Until this line existed a run printing
          # "test result: FAILED. 6 passed; 1 failed" still printed
          # "=== Memory Tests: ALL PASSED ===" and the job concluded success.
          # It was invisible while .agent-config-q8lht kept the job from ever
          # reaching its tests. Every other pipeline in this step is `echo |
          # tee`, so pipefail cannot fire on them.
          set -o pipefail

          echo "=== DCG Memory Leak Tests ===" | tee memory-output.log
          echo "Timestamp: $(date -Iseconds)" | tee -a memory-output.log
          echo "Runner: ${{ runner.os }}" | tee -a memory-output.log
          echo "Rust: $(rustc --version)" | tee -a memory-output.log
          echo "" | tee -a memory-output.log

          # Get baseline system memory
          echo "=== System Memory Baseline ===" | tee -a memory-output.log
          free -h | tee -a memory-output.log
          echo "" | tee -a memory-output.log

          echo "=== Running Memory Tests ===" | tee -a memory-output.log
          # Memory tests must run sequentially for accurate measurements.
          #
          # Optimized, but NOT `--release`. See .agent-config-q8lht.
          # `[profile.release]` here is tuned for a shipped binary (opt-level
          # "z", fat lto, codegen-units = 1). Measured with `cargo --unit-graph`:
          # `cargo test --release --test memory_tests` is 1081 units, 755 of them
          # at codegen-units = 1, because a test build drags the dev-dependencies
          # under that profile too. The `cargo build --release` steps in e2e,
          # scan-regression and perf-regression are 677 units / 359 at cgu = 1 --
          # and those jobs pass. This one built 2.1x as many rustc processes each
          # holding whole-crate LLVM IR, and on a 4 vCPU / 16 GB ubuntu-latest
          # runner the OOM killer took the runner service mid-dependency-compile.
          # The job then reported a bare exit 143, so an infra shutdown read as a
          # failing memory test.
          # `[profile.bench]` is the same graph at opt-level 3 / thin lto /
          # codegen-units 16 -- 1081 units, ZERO at cgu = 1, already proven to build here
          # (.agent-config-h4qaa) and what the budgets in src/perf.rs are
          # written against. These tests assert memory GROWTH against a
          # runtime baseline, so the profile moves the baseline, not the budget.
          if cargo test --test memory_tests --profile bench -- --nocapture --test-threads=1 2>&1 | tee -a memory-output.log; then
            echo "" | tee -a memory-output.log
            echo "=== Memory Tests: ALL PASSED ===" | tee -a memory-output.log
            echo "memory_tests_result=passed" >> $GITHUB_OUTPUT
          else
            echo "" | tee -a memory-output.log
            echo "=== Memory Tests: FAILED ===" | tee -a memory-output.log
            echo "memory_tests_result=failed" >> $GITHUB_OUTPUT
            exit 1
          fi

      - name: Parse memory metrics
        if: always()
        run: |
          echo "=== Memory Test Metrics ===" | tee -a memory-metrics.log
          echo "" | tee -a memory-metrics.log

          # Extract metrics from test output
          echo "Test Results:" | tee -a memory-metrics.log
          grep -E "^memory_" memory-output.log | tee -a memory-metrics.log || echo "No metrics found" | tee -a memory-metrics.log

          echo "" | tee -a memory-metrics.log
          echo "Growth Summary:" | tee -a memory-metrics.log
          grep -E "final.*growth" memory-output.log | tee -a memory-metrics.log || echo "No growth data" | tee -a memory-metrics.log

          echo "" | tee -a memory-metrics.log
          echo "Pass/Fail:" | tee -a memory-metrics.log
          grep -E "(PASSED|FAILED|panicked)" memory-output.log | tee -a memory-metrics.log || echo "No status found" | tee -a memory-metrics.log

      - name: Memory test summary
        if: always()
        run: |
          echo "## Memory Leak Tests" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Result badge
          if grep -q "ALL PASSED" memory-output.log; then
            echo "**Result:** ✅ All tests passed" >> $GITHUB_STEP_SUMMARY
          else
            echo "**Result:** ❌ Tests failed" >> $GITHUB_STEP_SUMMARY
          fi
          echo "" >> $GITHUB_STEP_SUMMARY

          # Metrics table
          echo "### Memory Growth by Test" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Test | Final Growth | Limit | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------|--------------|-------|--------|" >> $GITHUB_STEP_SUMMARY

          # Parse and format metrics
          grep -E "final.*growth" memory-output.log | while read line; do
            test_name=$(echo "$line" | grep -oP "^[^:]+")
            growth=$(echo "$line" | grep -oP "growth: \\K[0-9]+ KB" || echo "?")
            limit=$(echo "$line" | grep -oP "limit: \\K[0-9]+ KB" || echo "?")
            if echo "$line" | grep -q "PASSED"; then
              status="✅"
            else
              status="❌"
            fi
            echo "| $test_name | $growth | $limit | $status |" >> $GITHUB_STEP_SUMMARY
          done

          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Full Output" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          tail -50 memory-output.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload memory test artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: memory-test-output
          path: |
            memory-output.log
            memory-metrics.log
          retention-days: 14

  # A `benchmarks` job sat here and is gone on purpose; see .agent-config-j1qwb.
  #
  # It ran `cargo bench --bench heredoc_perf` on every push to main, read the
  # numbers against hard-coded budgets, and could not fail: its `exit 1` was
  # commented out. bench.yml runs the same bench on every push to main that
  # touches src/, benches/ or the Cargo files -- the pushes that can move it --
  # benches the base commit first on the same runner, and fails on a
  # regression. So this was a second, weaker copy of that gate, costing 8.7m
  # per push (run 35416438492) and caching a `target` dir against
  # .agent-config-wrlqe.

  # End-to-end shell script tests
  e2e:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build release binary
        run: cargo build --release

      - name: Run E2E tests
        id: e2e
        run: |
          set +e
          set -o pipefail

          mkdir -p e2e-artifacts
          ./scripts/e2e_test.sh --verbose --binary target/release/dcg --json --artifacts e2e-artifacts | tee e2e_output.json >/dev/null
          EXIT_CODE=${PIPESTATUS[0]}
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT

          echo "## E2E Test Results" >> $GITHUB_STEP_SUMMARY
          # Extract summary from JSON output
          if jq -e '.summary' e2e_output.json >/dev/null 2>&1; then
            echo '```json' >> $GITHUB_STEP_SUMMARY
            jq '.summary' e2e_output.json >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY

            FAILED=$(jq -r '.summary.failed // 0' e2e_output.json 2>/dev/null || echo "0")
            if [ "$FAILED" != "0" ]; then
              echo "" >> $GITHUB_STEP_SUMMARY
              echo "### First Failure" >> $GITHUB_STEP_SUMMARY
              echo "" >> $GITHUB_STEP_SUMMARY
              echo '```' >> $GITHUB_STEP_SUMMARY
              jq -r '.tests[] | select(.result == "fail") | "\(.id): \(.name)\n\n\(.output // "")"' e2e_output.json | head -n 40 >> $GITHUB_STEP_SUMMARY || true
              echo '```' >> $GITHUB_STEP_SUMMARY
            fi
          else
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -20 e2e_output.json >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi
          exit 0

      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-artifacts
          path: |
            e2e_output.json
            e2e-artifacts/
          retention-days: 14
          if-no-files-found: ignore

      - name: Check E2E result
        if: steps.e2e.outputs.exit_code != '0'
        run: |
          echo "::error::E2E suite failed (exit code ${{ steps.e2e.outputs.exit_code }}). See the 'e2e-artifacts' artifact and the step summary for the first failure."
          exit 1

  # Scan-mode regression fixtures (ensures scan output stays stable)
  scan-regression:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-scan-regression-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build release binary
        run: cargo build --release

      - name: Run scan regression fixtures
        id: scan_regression
        run: |
          set +e
          set -o pipefail

          ./scripts/scan_regression.sh 2>&1 | tee scan_regression.log
          EXIT_CODE=${PIPESTATUS[0]}
          echo "exit_code=$EXIT_CODE" >> $GITHUB_OUTPUT

          if [ -f /tmp/dcg_scan_regression_actual.json ]; then
            cp /tmp/dcg_scan_regression_actual.json scan_regression_actual.json
          fi

          echo "## Scan Regression (fixtures)" >> $GITHUB_STEP_SUMMARY
          if [ -f scan_regression_actual.json ] && jq -e '.summary' scan_regression_actual.json >/dev/null 2>&1; then
            echo '```json' >> $GITHUB_STEP_SUMMARY
            jq '.summary' scan_regression_actual.json >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
          else
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -40 scan_regression.log >> $GITHUB_STEP_SUMMARY || true
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

          if [ "$EXIT_CODE" != "0" ]; then
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "### Failure Details" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo '```' >> $GITHUB_STEP_SUMMARY
            tail -80 scan_regression.log >> $GITHUB_STEP_SUMMARY || true
            echo '```' >> $GITHUB_STEP_SUMMARY
          fi

          exit 0

      - name: Upload scan regression artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: scan-regression-artifacts
          path: |
            scan_regression.log
            scan_regression_actual.json
          retention-days: 14
          if-no-files-found: ignore

      - name: Check scan regression result
        if: steps.scan_regression.outputs.exit_code != '0'
        run: |
          echo "::error::Scan regression mismatch (exit code ${{ steps.scan_regression.outputs.exit_code }}). See the 'scan-regression-artifacts' artifact and the step summary for details."
          exit 1

  # Process-per-invocation perf regression gate (compares against committed baseline JSON)
  perf-regression:
    runs-on: ubuntu-latest
    needs: check
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo registry and target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-perf-regression-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Build release binary
        run: cargo build --release

      - name: Run perf baseline + compare to repo baseline
        id: perf
        run: |
          set +e

          BASELINE_JSON="perf/baselines/2026-01-11-after-lazy.json"
          CURRENT_JSON="perf-current.json"
          REPORT_MD="perf-regression-report.md"

          python3 scripts/perf_baseline.py \
            --bin target/release/dcg \
            --output "$CURRENT_JSON" \
            --warmup 10 \
            --runs 80 \
            --skip-trace
          GEN_EXIT=$?
          if [ "$GEN_EXIT" -ne 0 ]; then
            echo "exit_code=$GEN_EXIT" >> $GITHUB_OUTPUT
            echo "::error::perf baseline generation failed (exit code $GEN_EXIT)"
            exit 0
          fi

          python3 - "$BASELINE_JSON" "$CURRENT_JSON" "$REPORT_MD" <<'PY'
          import json
          import sys

          baseline_path = sys.argv[1]
          current_path = sys.argv[2]
          report_path = sys.argv[3]

          mult = 2.5
          slack_ms = 5.0
          rss_slack_kb = 8192

          with open(baseline_path, "r", encoding="utf-8") as handle:
              baseline = json.load(handle)
          with open(current_path, "r", encoding="utf-8") as handle:
              current = json.load(handle)

          baseline_cases = {c["id"]: c for c in baseline.get("cases", [])}
          current_cases = {c["id"]: c for c in current.get("cases", [])}

          violations = []
          rows = []

          for case_id in sorted(baseline_cases.keys()):
              if case_id not in current_cases:
                  violations.append(f"missing case in current run: {case_id}")
                  continue

              b = baseline_cases[case_id].get("metrics", {})
              c = current_cases[case_id].get("metrics", {})

              b_p50 = float(b.get("p50_ms", 0.0))
              c_p50 = float(c.get("p50_ms", 0.0))

              limit_p50 = b_p50 * mult + slack_ms
              status = "OK" if c_p50 <= limit_p50 else "REGRESSED"
              rows.append((case_id, b_p50, c_p50, limit_p50, status))

              if c_p50 > limit_p50:
                  violations.append(
                      f"{case_id} p50_ms {c_p50:.2f} > {limit_p50:.2f} (baseline {b_p50:.2f}, mult {mult}x + {slack_ms}ms)"
                  )

              b_rss = b.get("max_rss_kb")
              c_rss = c.get("max_rss_kb")
              if isinstance(b_rss, int) and isinstance(c_rss, int):
                  rss_limit = max(int(b_rss * 2.0), b_rss + rss_slack_kb)
                  if c_rss > rss_limit:
                      violations.append(
                          f"{case_id} max_rss_kb {c_rss} > {rss_limit} (baseline {b_rss})"
                      )

          # Also fail if new unexpected cases are added (keeps the harness stable)
          extra_cases = sorted(set(current_cases.keys()) - set(baseline_cases.keys()))
          if extra_cases:
              violations.append(f"unexpected new cases in current run: {', '.join(extra_cases)}")

          # Write report (Markdown for GHA summary + artifacts)
          lines = []
          lines.append("## Perf Regression Gate")
          lines.append("")
          lines.append(f"- Baseline: `{baseline_path}`")
          lines.append(f"- Threshold: `current_p50_ms <= baseline_p50_ms * {mult} + {slack_ms}ms`")
          lines.append(f"- RSS slack: `max(baseline*2, baseline+{rss_slack_kb}KB)` (when available)")
          lines.append("")
          lines.append("| Case | Baseline p50 (ms) | Current p50 (ms) | Limit (ms) | Status |")
          lines.append("|------|-------------------|-----------------|-----------|--------|")
          for case_id, b_p50, c_p50, limit_p50, status in rows:
              lines.append(f"| `{case_id}` | {b_p50:.2f} | {c_p50:.2f} | {limit_p50:.2f} | {status} |")
          lines.append("")

          if violations:
              lines.append("### Violations")
              lines.append("")
              for v in violations[:10]:
                  lines.append(f"- {v}")
              if len(violations) > 10:
                  lines.append(f"- ... and {len(violations) - 10} more")
              lines.append("")

          with open(report_path, "w", encoding="utf-8") as handle:
              handle.write("\n".join(lines))
              handle.write("\n")

          if violations:
              for v in violations[:5]:
                  print(f"::error::{v}")
              sys.exit(1)
          sys.exit(0)
          PY

          CHECK_EXIT=$?
          echo "exit_code=$CHECK_EXIT" >> $GITHUB_OUTPUT

          echo "## Perf Regression" >> $GITHUB_STEP_SUMMARY
          cat "$REPORT_MD" >> $GITHUB_STEP_SUMMARY 2>/dev/null || true

          exit 0

      - name: Upload perf regression artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-regression-artifacts
          path: |
            perf-current.json
            perf-regression-report.md
          retention-days: 14
          if-no-files-found: ignore

      - name: Check perf regression result
        if: steps.perf.outputs.exit_code != '0'
        run: |
          echo "::error::Perf regression gate failed (exit code ${{ steps.perf.outputs.exit_code }}). See 'perf-regression-artifacts' and the step summary."
          exit 1

  # Deep suite: fuzzing (scheduled or manual only)
  fuzz:
    runs-on: ubuntu-latest
    # Only run on schedule or manual trigger, not on every PR
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    # A backstop for a wedged run, not a budget: the build plus eight minutes
    # of fuzzing fit well inside it.
    timeout-minutes: 45
    # Findings are news, not a verdict on the run, like `toolchain-float`
    # below; see .agent-config-j1qwb. A failing target turns THIS job red, lists
    # itself in the step summary, uploads its crash input, and gets a bead. It
    # does not turn the run red. The first real run (37245858853) found three
    # inputs, all bytes no real command produces: NUL then `"<"`, `\""a`, and a
    # heredoc carrying \x01. Dale's 09-19 freeze stops hardening against such
    # constructs, so a finding may stay open for good. A run concluded by it
    # would be red every night, and a red that is always on means nothing --
    # the state this job was rescued from. The run's own conclusion stays the
    # suite's.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools-preview

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Cache cargo registry and fuzz corpus
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            fuzz/corpus
            fuzz/artifacts
          key: ${{ runner.os }}-fuzz-${{ hashFiles('**/Cargo.lock', '**/Cargo.toml', 'fuzz/**') }}
          restore-keys: |
            ${{ runner.os }}-fuzz-

      # One build, then every target fuzzes for its full minute; see
      # .agent-config-j1qwb.
      #
      # This used to be `timeout 10m cargo fuzz run "$target" ... || true` once
      # per target. Every `cargo fuzz run` starts with a build, and the build
      # alone outlasted ten minutes: cargo-fuzz compiles at one codegen unit by
      # default, so the whole crate went through ASan and coverage
      # instrumentation as a single LLVM module on one core. `timeout` killed
      # all eight targets mid-compile, `|| true` swallowed it, and the summary
      # still printed "completed". Run 37176865382 spent 80m on this job,
      # concluded success, and fuzzed nothing -- its log holds no libFuzzer line
      # at all. That job was the 81-minute nightly.
      #
      # `--codegen-units 16` is cargo-fuzz's own advice for faster builds at a
      # small cost per execution, the right side of that trade when each target
      # runs for sixty seconds. The build is its own step so its minutes show on
      # their own, and the run passes the same flags so it reuses that build.
      # A target passes only if it exits 0 AND libFuzzer printed its closing
      # "Done N runs" line, so a run that never fuzzed cannot read as green
      # again.
      - name: Build fuzz targets
        run: cargo fuzz build --codegen-units 16

      - name: Run fuzz targets (60s each)
        run: |
          set -o pipefail
          targets=$(cargo fuzz list)
          if [ -z "$targets" ]; then
            echo "::error::cargo fuzz list returned no targets"
            exit 1
          fi
          echo "## Fuzzing Results" >> "$GITHUB_STEP_SUMMARY"
          failed=0
          for target in $targets; do
            echo "::group::$target"
            if cargo fuzz run --codegen-units 16 "$target" -- -max_total_time=60 2>&1 | tee "fuzz-$target.log"; then
              rc=0
            else
              rc=$?
            fi
            echo "::endgroup::"
            done_line=$(grep -m1 -E '^Done [0-9]+ runs' "fuzz-$target.log" || true)
            if [ "$rc" -eq 0 ] && [ -n "$done_line" ]; then
              echo "- $target: ok -- $done_line" >> "$GITHUB_STEP_SUMMARY"
            else
              failed=$((failed + 1))
              echo "::error::$target failed (exit $rc, libFuzzer Done line: ${done_line:-missing})"
              echo "- $target: FAILED (exit $rc) -- ${done_line:-no libFuzzer Done line}" >> "$GITHUB_STEP_SUMMARY"
            fi
          done
          if [ "$failed" -gt 0 ]; then
            echo "::error::$failed fuzz target(s) failed; crash inputs are in the fuzz-artifacts upload"
            exit 1
          fi

      - name: Upload fuzz artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
          retention-days: 30
          if-no-files-found: ignore

  # Early warning, deliberately not a gate.
  #
  # `check` builds with the nightly pinned in rust-toolchain.toml, so a
  # toolchain roll can no longer turn main red on its own. This job is what
  # keeps the other half of that trade: without it we would meet each new lint
  # months late and all at once, at whatever moment someone bumped the pin.
  #
  # Nothing `needs:` this job, it never runs on a PR or a push, and
  # `continue-on-error` keeps it from failing the workflow. It is allowed to be
  # red. That is the point -- red here means "there is toolchain news", never
  # "no work may land".
  toolchain-float:
    name: toolchain-float (advisory)
    runs-on: ubuntu-latest
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    continue-on-error: true
    env:
      # The one place that deliberately escapes the pin. RUSTUP_TOOLCHAIN
      # outranks rust-toolchain.toml -- `rustup show active-toolchain` under it
      # reports "overridden by environment variable RUSTUP_TOOLCHAIN".
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rustfmt, clippy

      - name: Report which toolchains are being compared
        run: |
          rustc --version --verbose
          {
            echo "## Floating nightly vs the pin"
            echo ""
            echo "| | toolchain |"
            echo "|---|---|"
            echo "| floating (this job) | \`$(rustc --version)\` |"
            echo "| pinned (every other job) | \`$(grep '^channel' rust-toolchain.toml)\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: cargo fmt --check (floating nightly)
        id: fmt
        continue-on-error: true
        run: cargo fmt --all -- --check

      - name: cargo clippy (floating nightly)
        id: clippy
        continue-on-error: true
        run: cargo clippy --all-targets -- -D warnings

      # Both checks above swallow their own failure so neither hides the other.
      # This step is what makes the job visibly red when there is news.
      - name: Verdict
        if: always()
        run: |
          fmt='${{ steps.fmt.outcome }}'
          clippy='${{ steps.clippy.outcome }}'
          echo "fmt=$fmt clippy=$clippy"
          if [ "$fmt" = success ] && [ "$clippy" = success ]; then
            echo "The pin can move to this nightly with no fallout." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo ""
            echo "**Floating nightly disagrees with this tree** (fmt: $fmt, clippy: $clippy)."
            echo "Nothing is blocked. Bumping the pin in \`rust-toolchain.toml\` will inherit this."
          } >> "$GITHUB_STEP_SUMMARY"
          exit 1
